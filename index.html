  :root {
    /* Single white world: the pyramid alone, scaled to fit, text edited in place. */
    --page: #ffffff;
    --ink: #ffffff;
    --font-display: "Montserrat", "Arial Black", Arial, sans-serif;
    --font-body: "Open Sans", Arial, Helvetica, sans-serif;
    --font-ui: "Roboto", "Helvetica Neue", Arial, sans-serif;
    --ui-ink: #b8b8b8;
    --ui-ink-hover: #8a8a8a;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .stage {
    position: relative;
    container-type: inline-size;
    width: min(calc(100vw - 32px), calc((100dvh - 80px) * 1430 / 842));
    aspect-ratio: 1430 / 842;
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .t, .s {
    position: absolute;
    left: 34.72%;
    margin: 0;
    color: var(--ink);
    white-space: nowrap;
    line-height: 1;
    cursor: text;
    outline: none;
    min-width: 1em;
    min-height: 1em;
    caret-color: var(--ink);
  }
  .t {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: calc(4.196cqw * var(--k, 1));
    letter-spacing: -0.01em;
    transform: translateY(-0.8585em);
  }
  .s {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: calc(2.203cqw * var(--k, 1));
    letter-spacing: -0.035em;
    transform: translateY(-0.888em);
  }
  .t:focus-visible, .s:focus-visible {
    outline: 2px dashed rgba(255, 255, 255, 0.7);
    outline-offset: 0.12em;
  }
  .dl {
    position: fixed;
    left: 16px;
    bottom: 12px;
    padding: 4px 0;
    border: 0;
    background: none;
    font-family: var(--font-ui);
    font-weight: 100;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--ui-ink);
    cursor: pointer;
  }
  .dl:hover { color: var(--ui-ink-hover); }
  .dl:focus-visible { outline: 1px solid var(--ui-ink); outline-offset: 2px; }
  ::selection { background: rgba(0, 0, 0, 0.28); color: #fff; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg viewBox="0 0 1430 842" aria-hidden="true" id="shapes"></svg>
</div>
<button type="button" class="dl" id="dl">Download as png</button>
<script>
(function () {
  var W = 1430, H = 842;
  var RIGHT = 1406;
  var TEXT_X = 496.5, TEXT_MAX = 886;
  var bands = [[63, 199], [207, 348], [356, 497], [505, 646], [654, 795]];
  var colours = [
    ["#7c9ff0", "#1b3a92"],
    ["#64b14d", "#316a1c"],
    ["#f4c157", "#ea8632"],
    ["#ee8d4f", "#ce4c23"],
    ["#e0483f", "#901c13"]
  ];
  var defaults = [
    ["Self-actualization", "desire to become the most that one can be"],
    ["Esteem", "respect, self-esteem, status, recognition, strength, freedom"],
    ["Love and belonging", "friendship, intimacy, family, sense of connection"],
    ["Safety needs", "personal security, employment, resources, health, property"],
    ["Physiological needs", "air, water, food, shelter, sleep, clothing, reproduction"]
  ];
  var KEY = "needs-pyramid-v1";

  function leftEdge(y) { return 477 - 0.573 * (y - 63); }
  function shadeEdge(y) { return 485 + 0.5634 * (y - 63); }
  function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + "," + p[1]; }).join(" "); }

  var svg = document.getElementById("shapes");
  var ns = "http://www.w3.org/2000/svg";
  var markup = "";
  bands.forEach(function (b, i) {
    var t = b[0], btm = b[1];
    markup += '<polygon fill="' + colours[i][0] + '" points="' +
      pts([[leftEdge(t), t], [RIGHT, t], [RIGHT, btm], [leftEdge(btm), btm]]) + '"/>';
    markup += '<polygon fill="' + colours[i][1] + '" points="' +
      pts([[leftEdge(t), t], [shadeEdge(t), t], [shadeEdge(btm), btm], [leftEdge(btm), btm]]) + '"/>';
  });
  svg.innerHTML = markup;

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(saved) || saved.length !== defaults.length) saved = null;

  var stage = document.getElementById("stage");
  var els = [];
  var plainOK = (function () {
    var d = document.createElement("div");
    try { d.contentEditable = "plaintext-only"; } catch (e) { return false; }
    return d.contentEditable === "plaintext-only";
  })();

  function makeEditable(cls, text, baselineY, label) {
    var el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    el.style.top = (baselineY / H * 100) + "%";
    el.contentEditable = plainOK ? "plaintext-only" : "true";
    el.spellcheck = false;
    el.setAttribute("role", "textbox");
    el.setAttribute("aria-label", label);
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); el.blur(); }
    });
    el.addEventListener("paste", function (e) {
      if (plainOK) return;
      e.preventDefault();
      var txt = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
      document.execCommand("insertText", false, txt);
    });
    el.addEventListener("input", function () {
      if (el.innerHTML.indexOf("<") !== -1) el.textContent = el.textContent;
      fit(el);
      save();
    });
    stage.appendChild(el);
    els.push(el);
    return el;
  }

  bands.forEach(function (b, i) {
    var words = saved ? saved[i] : defaults[i];
    makeEditable("t", words[0], b[0] + 74, "Level " + (i + 1) + " title");
    makeEditable("s", words[1], b[0] + 115, "Level " + (i + 1) + " description");
  });

  function fit(el) {
    el.style.setProperty("--k", 1);
    var max = TEXT_MAX / W * stage.clientWidth;
    var w = el.scrollWidth;
    if (w > max) el.style.setProperty("--k", (max / w).toFixed(4));
  }
  function fitAll() { els.forEach(fit); }

  function save() {
    var data = [];
    for (var i = 0; i < els.length; i += 2) data.push([els[i].textContent, els[i + 1].textContent]);
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  function kOf(el) { return parseFloat(el.style.getPropertyValue("--k")) || 1; }

  var dlReady = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("downloads").catch(function () { return null; })
    : Promise.resolve(null);

  function renderPng(scale) {
    var c = document.createElement("canvas");
    c.width = W * scale; c.height = H * scale;
    var ctx = c.getContext("2d");
    ctx.scale(scale, scale);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
    bands.forEach(function (b, i) {
      var t = b[0], btm = b[1];
      ctx.fillStyle = colours[i][0];
      ctx.beginPath();
      ctx.moveTo(leftEdge(t), t); ctx.lineTo(RIGHT, t); ctx.lineTo(RIGHT, btm); ctx.lineTo(leftEdge(btm), btm);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = colours[i][1];
      ctx.beginPath();
      ctx.moveTo(leftEdge(t), t); ctx.lineTo(shadeEdge(t), t); ctx.lineTo(shadeEdge(btm), btm); ctx.lineTo(leftEdge(btm), btm);
      ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = "#ffffff";
    ctx.textBaseline = "alphabetic";
    bands.forEach(function (b, i) {
      var tEl = els[i * 2], sEl = els[i * 2 + 1];
      var ts = 60 * kOf(tEl), ss = 31.5 * kOf(sEl);
      ctx.font = "700 " + ts + "px Montserrat";
      if ("letterSpacing" in ctx) ctx.letterSpacing = (-0.01 * ts) + "px";
      ctx.fillText(tEl.textContent, TEXT_X, b[0] + 74);
      ctx.font = "700 " + ss + "px \"Open Sans\"";
      if ("letterSpacing" in ctx) ctx.letterSpacing = (-0.035 * ss) + "px";
      ctx.fillText(sEl.textContent, TEXT_X, b[0] + 115);
    });
    return new Promise(function (res) { c.toBlob(res, "image/png"); });
  }

  document.getElementById("dl").addEventListener("click", function () {
    var all = els.map(function (e) { return e.textContent; }).join(" ");
    var loads = document.fonts
      ? Promise.all([document.fonts.load("700 60px Montserrat", all), document.fonts.load("700 32px \"Open Sans\"", all)]).catch(function () {})
      : Promise.resolve();
    loads.then(function () { return renderPng(2); }).then(function (blob) {
      if (!blob) return;
      var name = "needs-pyramid.png";
      dlReady.then(function (dl) {
        if (dl) { dl.save({ filename: name, data: blob }).catch(function () {}); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      });
    });
  });

  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  window.addEventListener("resize", fitAll);
})();
</script>
